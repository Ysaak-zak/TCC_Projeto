<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar(active)" class="medico-sidebar">
    <a th:href="@{/medico}" class="medico-brand">
        <span class="medico-brand-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg></span>
        <span><strong>Portal Médico</strong><small>Saúde e desempenho</small></span>
    </a>
    <p class="medico-nav-caption">ÁREA MÉDICA</p>
    <nav aria-label="Menu médico" class="medico-nav">
        <a th:href="@{/medico}" class="medico-nav-link" th:classappend="${active == 'vincular' ? 'is-active' : ''}" th:attr="aria-current=${active == 'vincular' ? 'page' : null}">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M20 8v6m-3-3h6"/><circle cx="9" cy="7" r="4"/></svg><span>Vincular atletas</span>
        </a>
        <a th:href="@{/medico/atletas-vinculados}" class="medico-nav-link" th:classappend="${active == 'atletas' ? 'is-active' : ''}" th:attr="aria-current=${active == 'atletas' ? 'page' : null}">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m20 0v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/><circle cx="9" cy="7" r="4"/></svg><span>Atletas vinculados</span>
        </a>
        <a th:href="@{/medico/atletas-vinculados#plano-alimentar}" class="medico-nav-link" th:classappend="${active == 'alimentacao' ? 'is-active' : ''}" th:attr="aria-current=${active == 'alimentacao' ? 'page' : null}">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v7a3 3 0 0 0 6 0V3M7 3v18m10-18v18m0-18c2 2 3 5 3 8h-3"/></svg><span>Alimentação</span>
        </a>
        <a th:href="@{/medico/perfil}" class="medico-nav-link" th:classappend="${active == 'perfil' ? 'is-active' : ''}" th:attr="aria-current=${active == 'perfil' ? 'page' : null}">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg><span>Meu perfil</span>
        </a>
    </nav>
    <div class="medico-sidebar-footer">
        <p>Gestão de saúde do atleta</p>
        <form th:action="@{/logout}" method="post">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="medico-logout"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4m7 14 5-5-5-5m5 5H9"/></svg><span>Sair da conta</span></button>
        </form>
    </div>
</aside>
</body>
</html>
