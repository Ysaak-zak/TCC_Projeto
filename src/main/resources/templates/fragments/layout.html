<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="head-resources">
    <link rel="stylesheet" th:href="@{/css/medico-layout.css}">
    <link rel="icon" th:href="@{/img/iconFun.png}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/tailwind-theme.js}"></script>
</th:block>
<header th:fragment="brand-header(titulo, tone)" class="flex items-center justify-between px-6 py-4 text-white"
        th:classappend="${'bg-' + tone + '-700'}">
    <a th:href="@{/home}" class="font-bold">Sistema Médico Desportivo</a>
    <span th:text="${titulo}"></span>
</header>
</body>
</html>
