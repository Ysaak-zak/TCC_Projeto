<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Minha alimentação</title>
</head>
<body class="min-h-screen bg-black text-white">
<main class="flex min-h-screen flex-col xl:flex-row">
    <aside class="w-full bg-purple-600 xl:sticky xl:top-0 xl:h-screen xl:w-1/3">
        <nav class="flex flex-wrap justify-between gap-1 px-2 py-3 xl:min-h-screen xl:flex-col xl:justify-start xl:gap-5 xl:px-6 xl:py-5">
            <div class="flex items-center gap-3 border-b-0 pb-2 text-center xl:w-full xl:border-b-4 xl:pb-5">
                <img class="rounded-full bg-emerald-500 p-3" th:src="@{/img/user.svg}" alt="">
                <h1>Área do atleta</h1>
            </div>
            <a class="rounded-2xl border-2 border-purple-700 px-4 py-2 text-center hover:bg-purple-800 xl:px-8 xl:py-4 xl:text-xl"
               th:href="@{/atleta}">DASHBOARD</a>
            <a class="rounded-2xl border-2 border-purple-700 bg-purple-950 px-4 py-2 text-center xl:px-8 xl:py-4 xl:text-xl"
               th:href="@{/atleta/perfil}">PERFIL</a>
            <a aria-current="page" class="rounded-2xl border-2 border-purple-700 bg-purple-800 px-4 py-2 text-center xl:px-8 xl:py-4 xl:text-xl"
               th:href="@{/atleta/alimentacao}">ALIMENTAÇÃO</a>
            <form class="m-0 mt-auto w-full" th:action="@{/logout}" method="post">
                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="w-full rounded-2xl border-2 border-purple-700 bg-purple-950 px-4 py-3 hover:bg-purple-800 xl:py-4 xl:text-xl" type="submit">SAIR</button>
            </form>
        </nav>
    </aside>

    <section class="w-full px-5 py-8 xl:px-12">
        <a class="text-purple-300 hover:text-white" th:href="@{/atleta}">← Voltar ao painel</a>
        <header class="my-8">
            <p class="text-sm font-semibold uppercase tracking-widest text-purple-300">Área do atleta</p>
            <h1 class="mt-2 text-3xl font-bold">Minha alimentação</h1>
            <p class="mt-2 text-white/70">Recomendações registradas pelo seu médico.</p>
        </header>

        <p th:if="${#lists.isEmpty(recomendacoes)}" class="rounded-2xl border border-purple-800 bg-purple-950 p-6 text-white/80">
            Ainda não há recomendações alimentares cadastradas.
        </p>
        <ul th:unless="${#lists.isEmpty(recomendacoes)}" class="max-w-4xl space-y-4">
            <li th:each="item : ${recomendacoes}" class="rounded-2xl border border-purple-800 bg-purple-950 p-6">
                <div class="flex flex-wrap items-start justify-between gap-3">
                    <h2 class="text-xl font-semibold text-purple-200" th:text="${item.refeicao}">Refeição</h2>
                    <span class="text-sm text-white/70" th:text="${'Início: ' + #temporals.format(item.dataInicio, 'dd/MM/yyyy')}">Início</span>
                </div>
                <p class="mt-4"><strong>Objetivo:</strong> <span th:text="${item.objetivo}"></span></p>
                <p class="mt-3 whitespace-pre-line text-white/85" th:text="${item.orientacao}"></p>
                <p th:if="${item.dataRevisao != null}" class="mt-4 text-sm text-white/60"
                   th:text="${'Revisão prevista: ' + #temporals.format(item.dataRevisao, 'dd/MM/yyyy')}"></p>
            </li>
        </ul>
    </section>
</main>
</body>
</html>
