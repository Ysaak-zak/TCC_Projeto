<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil | Atleta</title>
    <link rel="icon" th:href="@{/img/iconFun.png}">
    <link rel="stylesheet" th:href="@{/css/atleta-tailwind.css}">
</head>
<body class="flex min-h-screen flex-col bg-black font-sans text-white scheme-dark md:flex-row">
    <div th:replace="~{atletaPages/navegacao :: menu('perfil', ${perfil.name}, null)}"></div>
    <main id="conteudo" class="flex min-w-0 flex-1 scroll-mt-6 flex-col p-4 sm:p-6 lg:p-8">
        <article aria-labelledby="titulo-perfil" class="rounded-2xl border border-t-4 border-gray-800 border-t-purple-500 bg-gray-950">
            <header class="p-5 sm:p-6">
                <p class="text-xs font-bold tracking-wide uppercase text-purple-300">Perfil atleta</p>
                <h1 id="titulo-perfil" class="mt-2 wrap-anywhere font-serif text-2xl font-bold sm:text-3xl"
                    th:text="${#strings.isEmpty(perfil.name) ? 'Atleta' : perfil.name}">Nome do atleta</h1>
            </header>

            <div class="grid md:grid-cols-2"
                 th:with="secoes=${ {
                    {'Dados pessoais', {
                        {'Nome completo', perfil.name}, {'CPF', perfil.cpf}, {'RG', perfil.rg},
                        {'Data de nascimento', perfil.dataNascimento != null ? #temporals.format(perfil.dataNascimento, 'dd/MM/yyyy') : null},
                        {'Sexo', perfil.sexo?.nome}, {'Tipo sanguíneo', perfil.sangue?.rotulo},
                        {'Peso', perfil.pesoMigrama}, {'Altura', perfil.alturaCetimentro}
                    }},
                    {'Contato', {
                        {'E-mail', perfil.email}, {'Telefone fixo', perfil.telefoneFixo}, {'WhatsApp', perfil.telefoneZap}
                    }},
                    {'Endereço', {
                        {'CEP', perfil.moradia_fk?.cep}, {'Rua ou avenida', perfil.moradia_fk?.avenida},
                        {'Número', perfil.moradia_fk?.sn}, {'Bairro', perfil.moradia_fk?.bairro},
                        {'Cidade', perfil.moradia_fk?.cidade}, {'UF', perfil.uf}
                    }},
                    {'Filiação', {
                        {'Nome da mãe', perfil.pais_fk?.maeNome}, {'Nome do pai', perfil.pais_fk?.paiName},
                        {'Telefone da mãe', perfil.pais_fk?.maeTelefone}, {'Telefone do pai', perfil.pais_fk?.paiTelefone},
                        {'E-mail da mãe', perfil.pais_fk?.maeEmail}, {'E-mail do pai', perfil.pais_fk?.paiEmail}
                    }}
                 } }">
                <section th:each="secao, estado : ${secoes}" class="min-w-0 border-t border-gray-800 p-5 sm:p-6 md:even:border-l"
                         th:attr="aria-labelledby=|dados-${estado.index}|">
                    <h2 class="font-serif text-xl font-bold" th:id="|dados-${estado.index}|" th:text="${secao[0]}">Dados pessoais</h2>
                    <dl class="mt-4 grid grid-cols-2 gap-4">
                        <div th:each="campo : ${secao[1]}" class="min-w-0" th:classappend="${campo[0] == 'E-mail' ? 'col-span-2' : null}">
                            <dt class="text-xs font-bold tracking-wide uppercase text-gray-300" th:text="${campo[0]}">Campo</dt>
                            <dd th:with="vazio=${#strings.isEmpty(campo[1])}" class="mt-1 wrap-anywhere text-sm" th:classappend="${vazio ? 'text-gray-400' : 'font-semibold'}"
                                th:text="${vazio ? 'Não informado' : campo[1]}">Não informado</dd>
                        </div>
                    </dl>
                </section>
            </div>
        </article>
    </main>
</body>
</html>
