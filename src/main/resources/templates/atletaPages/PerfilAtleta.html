<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Atleta</title>
    <th:block th:replace="~{fragments/layout :: head-resources}"></th:block>
</head>
<body class="min-h-screen bg-[#f7f9f8] font-sans text-slate-700">
    <div class="min-h-screen xl:flex">
        <section class="w-full xl:w-1/3 bg-purple-600 sticky top-0 z-50 h-auto xl:h-screen xl:overflow-y-auto">
            <nav
                class="list-none flex flex-wrap xl:flex-nowrap xl:flex-col xl:gap-5 gap-1 sm:justify-between xl:justify-start px-2 xl:py-5 xl:min-h-screen min-h-10 ">
                <li
                    class="    text-center  ">
                   <section class="flex xl:border-b-4 pb-4 py-2 items-center gap-3 ">
                        <img class="xl:bg-emerald-500 xl:p-4 px-3 rounded-4xl" th:src="@{/img/user.svg}" alt="">
                        <h1 th:text="${perfil.name}">Nome do atleta</h1>
                    </section>
                </li>

                <li
                    class="xl:border-2 xl:rounded-2xl xl:py-5 xl:text-2xl  text-center xl:bg-blue-900 border-purple-700 py-2  xl:px-9 text-red-600 xl:text-white ">
                    <a th:href="@{/atleta}">DASHBOARD</a>
                </li>

                <li
                    class="xl:border-2 xl:rounded-2xl xl:py-5 xl:text-2xl  text-center xl:bg-purple-950 border-purple-700 py-2  xl:px-9    xl:hover:bg-purple-800 duration-300 hover:text-red-600 hover:text-white">
                    <a th:href="@{/atleta/perfil}">PERFIL</a>
                </li>

                <li
                    class="xl:border-2 xl:rounded-2xl xl:py-5 xl:text-2xl  text-center xl:bg-purple-950 border-purple-700 py-2  xl:px-9    xl:hover:bg-purple-800 duration-300 hover:text-red-600 hover:text-white">
                    <a href="">TREINOS</a>
                </li>

                <li
                    class="xl:border-2 xl:rounded-2xl xl:py-5 xl:text-2xl  text-center xl:bg-purple-950 border-purple-700 py-2  xl:px-9    xl:hover:bg-purple-800 duration-300 hover:text-red-600 hover:text-white">
                    <a href="">FICHA MEDICA</a>
                </li>

                <li class="xl:mt-auto shrink-0">
                    <form th:action="@{/logout}" method="post" class="m-0 w-full">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit"
                                class="block w-full cursor-pointer border-2 border-purple-700 rounded-2xl bg-purple-950 px-4 py-3 text-center text-white xl:px-9 xl:py-5 xl:text-2xl hover:bg-purple-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-white">
                            SAIR
                        </button>
                    </form>
                </li>


            </nav>
        </section>
    <main class="min-w-0 flex-1 px-5 py-6 sm:px-8 lg:px-10">

        <header class="mb-6 rounded-2xl border-t-4 border-atleta-600 bg-white p-6 shadow-sm">
            <p class="text-sm font-semibold uppercase tracking-wide text-atleta-600">Perfil Atleta</p>
            <h1 class="mt-2 font-display text-2xl font-bold text-atleta-700 sm:text-3xl" th:text="${perfil.name}">Nome do atleta</h1>
        </header>
        <div class="grid grid-cols-1 gap-6 lg:grid-cols-2"
             th:with="secoes=${ { {'Dados pessoais', {{'Nome', perfil.name}, {'CPF', perfil.cpf}, {'RG', perfil.rg}, {'Data de nascimento', perfil.dataNascimento}, {'Sexo', perfil.sexo}, {'Tipo sanguíneo', perfil.sangue}, {'Peso', perfil.pesoMigrama}, {'Altura', perfil.alturaCetimentro}}}, {'Contato', {{'E-mail', perfil.email}, {'Telefone fixo', perfil.telefoneFixo}, {'WhatsApp', perfil.telefoneZap}}}, {'Endereço', {{'CEP', perfil.moradia_fk?.cep}, {'Rua / Avenida', perfil.moradia_fk?.avenida}, {'Número', perfil.moradia_fk?.sn}, {'Bairro', perfil.moradia_fk?.bairro}, {'Cidade', perfil.moradia_fk?.cidade}, {'UF', perfil.uf}}}, {'Filiação', {{'Nome da mãe', perfil.pais_fk?.maeNome}, {'Telefone da mãe', perfil.pais_fk?.maeTelefone}, {'E-mail da mãe', perfil.pais_fk?.maeEmail}, {'Nome do pai', perfil.pais_fk?.paiName}, {'Telefone do pai', perfil.pais_fk?.paiTelefone}, {'E-mail do pai', perfil.pais_fk?.paiEmail}}} } }">
            <section th:each="secao : ${secoes}" class="rounded-2xl border border-slate-100 bg-white p-6 shadow-sm">
                <h2 class="mb-5 border-b border-slate-100 pb-3 font-display text-xl font-bold text-atleta-700" th:text="${secao[0]}">Dados pessoais</h2>
                <dl class="grid grid-cols-1 gap-5 sm:grid-cols-2">
                    <div th:each="campo : ${secao[1]}" class="min-w-0">
                        <dt class="text-xs font-semibold uppercase tracking-wide text-slate-400" th:text="${campo[0]}">Campo</dt>
                        <dd class="mt-1 break-words font-medium text-slate-800" th:text="${campo[1] ?: 'Não informado'}">Não informado</dd>
                    </div>
                </dl>
            </section>
        </div>
    </main>
    </div>
</body>
</html>
