<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
    <aside th:fragment="menu(pagina, nome, semanaId)" aria-label="Navegação do atleta"
           th:with="painelUrl=${semanaId != null} ? @{/atleta(semanaId=${semanaId})} : @{/atleta},
                    treinosUrl=${semanaId != null} ? @{/atleta/treinos(semanaId=${semanaId})} : @{/atleta/treinos}"
           class="relative flex shrink-0 flex-col bg-purple-600 px-4 py-5 text-white
                  md:sticky md:top-0 md:h-dvh md:w-64 md:overflow-y-auto md:px-5 md:py-7">
        <a class="sr-only focus:not-sr-only focus:absolute focus:top-3 focus:left-3 focus:z-20 focus:rounded-lg focus:bg-white focus:px-3 focus:py-2 focus:text-purple-950" href="#conteudo">Ir para o conteúdo</a>

        <a th:href="${painelUrl}" class="mb-6 flex items-center gap-3 rounded-lg focus-visible:outline-2 focus-visible:outline-white">
            <span class="flex size-11 shrink-0 items-center justify-center rounded-lg bg-emerald-500">
                <img th:src="@{/img/user.svg}" class="size-6 brightness-0" alt="">
            </span>
            <span class="min-w-0 wrap-anywhere">
                <strong class="block text-lg">Portal do Atleta</strong>
                <small th:unless="${#strings.isEmpty(nome)}" class="block text-xs" th:text="${nome}">Nome do atleta</small>
            </span>
        </a>

        <nav aria-label="Menu do atleta"
             class="flex gap-2 overflow-x-auto md:flex-col md:overflow-visible"
             style="scrollbar-color: var(--color-purple-950) transparent">
            <a th:href="${painelUrl}"
               class="flex min-h-11 shrink-0 items-center gap-2 border-b-2 px-2 text-sm hover:underline md:border-b-0 md:border-l-2 md:px-3"
               th:classappend="${pagina == 'painel' ? 'border-blue-200 font-bold' : 'border-transparent'}"
               th:attr="aria-current=${pagina == 'painel' ? 'page' : null}">
                <img th:src="@{/img/dash.svg}" class="size-5 shrink-0 brightness-0 invert" alt="">
                Dashboard
            </a>
            <a th:href="@{/atleta/perfil}"
               class="flex min-h-11 shrink-0 items-center gap-2 border-b-2 px-2 text-sm hover:underline md:border-b-0 md:border-l-2 md:px-3"
               th:classappend="${pagina == 'perfil' ? 'border-blue-200 font-bold' : 'border-transparent'}"
               th:attr="aria-current=${pagina == 'perfil' ? 'page' : null}">
                <img th:src="@{/img/user.svg}" class="size-5 shrink-0 brightness-0 invert" alt="">
                Perfil
            </a>
            <a th:href="${treinosUrl}"
               class="flex min-h-11 shrink-0 items-center gap-2 border-b-2 px-2 text-sm hover:underline md:border-b-0 md:border-l-2 md:px-3"
               th:classappend="${pagina == 'treinos' ? 'border-blue-200 font-bold' : 'border-transparent'}"
               th:attr="aria-current=${pagina == 'treinos' ? 'page' : null}">
                <img th:src="@{/img/calen.svg}" class="size-5 shrink-0 brightness-0 invert" alt="">
                Treinos
            </a>
            <a th:href="@{/atleta/alimentos}"
               class="flex min-h-11 shrink-0 items-center gap-2 border-b-2 px-2 text-sm hover:underline md:border-b-0 md:border-l-2 md:px-3"
               th:classappend="${pagina == 'alimentos' ? 'border-blue-200 font-bold' : 'border-transparent'}"
               th:attr="aria-current=${pagina == 'alimentos' ? 'page' : null}">
                <img th:src="@{/img/medico_ifood.svg}" class="size-5 shrink-0 brightness-0 invert" alt="">
                Alimentos
            </a>
        </nav>

        <form th:action="@{/logout}" method="post" class="mt-auto pt-6">
            <button type="submit" class="flex min-h-11 w-full cursor-pointer items-center gap-2 px-2 text-sm font-medium
                    underline-offset-4 hover:underline focus-visible:outline-2 focus-visible:outline-white md:px-3">
                <img th:src="@{/img/sair.svg}" class="size-5 shrink-0 brightness-0 invert" alt="">
                Sair
            </button>
        </form>
    </aside>
</body>
</html>
