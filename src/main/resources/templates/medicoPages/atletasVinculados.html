<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atletas Vinculados | Médico</title>
    <th:block th:replace="~{fragments/layout :: head-resources}"></th:block>
</head>
<body class="bg-slate-100 min-h-screen p-8">
    <div class="mx-auto max-w-4xl rounded-2xl bg-white p-8 shadow-sm ring-1 ring-slate-200">
        <div class="mb-6 flex items-center justify-between">
            <div>
                <p class="text-sm uppercase tracking-wide text-medico-600 font-bold">Médico</p>
                <h1 class="text-3xl font-bold text-slate-800" th:text="${medico != null ? medico.name : 'Nome do médico'}">Nome do médico</h1>
            </div>
            <a th:href="@{/medico}" class="rounded-full bg-medico-500 px-4 py-2 text-sm font-semibold text-white hover:bg-medico-600">← Voltar</a>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full border-separate border-spacing-y-2 text-left text-sm">
                <thead>
                    <tr class="bg-slate-100 text-slate-700">
                        <th class="px-4 py-3 rounded-l-lg">Atleta</th>
                        <th class="px-4 py-3 rounded-r-lg">Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="nome : ${lisNome}" class="bg-slate-50">
                        <td class="px-4 py-3 rounded-l-lg font-medium text-slate-700" th:text="${nome}">Nome atleta</td>
                        <td class="px-4 py-3 rounded-r-lg text-medico-600 font-semibold">Vinculado</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
