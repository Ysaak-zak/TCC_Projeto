<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atletas Vinculados | Médico</title>
    <link rel="stylesheet" th:href="@{/css/medico-layout.css}">
        <link rel="icon" th:href="@{/img/iconFun.png}">
        <script src="https://cdn.tailwindcss.com"></script>
        <script th:src="@{/js/tailwind-theme.js}"></script>
</head>
<body class="min-h-screen bg-slate-100">
    <div class="min-h-screen md:flex">
        <aside aria-label="Navegação do médico"
        class="print:hidden relative flex shrink-0 flex-col bg-emerald-950 px-4 py-5 text-emerald-100 md:sticky md:top-0 md:h-dvh md:w-64 md:overflow-y-auto md:px-5 md:py-7">
        <a th:href="@{/medico}" class="mb-6 flex items-center gap-3 pr-24 md:pr-0">
            <img th:src="@{/img/MedicoVerd.svg}" alt="" class="h-11 w-11 object-contain">
            <span><strong class="block text-lg text-white">Portal Médico</strong><small class="block text-xs text-emerald-200">Saúde e desempenho</small></span>
        </a>
        <p class="mb-3 hidden px-3 text-[10px] font-bold tracking-widest text-emerald-200 md:block">ÁREA MÉDICA</p>
        <nav aria-label="Menu médico" class="flex gap-2 overflow-x-auto md:flex-col">
            <a th:href="@{/medico}" class="shrink-0 rounded-xl border px-3 py-3 text-sm focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-300 border-transparent text-emerald-100 hover:bg-white/10 hover:text-white">
                <div class="flex items-center gap-3">
                    <img th:src="@{/img/add_atleta.svg}" alt="" class="h-5 w-5 shrink-0 object-contain brightness-0 invert">
                    <p>Vincular atletas</p>
                </div>
            </a>
            <a th:href="@{/medico/atletas-vinculados}" class="shrink-0 rounded-xl border px-3 py-3 text-sm focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-300 border-emerald-200 bg-emerald-50 font-bold text-emerald-950" aria-current="page">
                <div class="flex items-center gap-3">
                    <img th:src="@{/img/ateltaVincule.svg}" alt="" class="h-5 w-5 shrink-0 object-contain brightness-0 invert">
                    <p>Atletas vinculados</p>
                </div>
            </a>
            <a th:href="@{/medico/alimentacao}" class="shrink-0 rounded-xl border px-3 py-3 text-sm focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-300 border-transparent text-emerald-100 hover:bg-white/10 hover:text-white">
                <div class="flex items-center gap-3">
                    <img th:src="@{/img/medico_ifood.svg}" alt="" class="h-5 w-5 shrink-0 object-contain brightness-0 invert">
                    <p>Alimentação</p>
                </div>
            </a>
            <a th:href="@{/medico/exame-urina}" class="shrink-0 rounded-xl border px-3 py-3 text-sm focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-300 border-transparent text-emerald-100 hover:bg-white/10 hover:text-white">
                <div class="flex items-center gap-3">
                    <img th:src="@{/img/urinaTeste.png}" alt="" class="h-5 w-5 shrink-0 object-contain brightness-0 invert">
                    <p>Exame de urina</p>
                </div>
            </a>
            <a th:href="@{/medico/exame-sangue}" class="shrink-0 rounded-xl border px-3 py-3 text-sm focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-300 border-transparent text-emerald-100 hover:bg-white/10 hover:text-white">
                <div class="flex items-center gap-3">
                    <img th:src="@{/img/urinaTeste.png}" alt="" class="h-5 w-5 shrink-0 object-contain brightness-0 invert">
                    <p>Exame de sangue</p>
                </div>
            </a>
            <a th:href="@{/medico/perfil}" class="shrink-0 rounded-xl border px-3 py-3 text-sm focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-300 border-transparent text-emerald-100 hover:bg-white/10 hover:text-white">
                <div class="flex items-center gap-3">
                    <img th:src="@{/img/MedicoVerd.svg}" alt="" class="h-5 w-5 shrink-0 object-contain brightness-0 invert">
                    <p>Meu perfil</p>
                </div>
            </a>
        </nav>
        <div class="mt-auto pt-7">
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="w-full rounded-xl px-3 py-3 text-left text-sm hover:bg-white/10">Sair</button>
            </form>
        </div>
    </aside>
    <main class="min-w-0 flex-1 p-5 md:p-8">
    <div class="mx-auto max-w-4xl rounded-2xl bg-white p-8 shadow-sm ring-1 ring-slate-200">
        <div class="mb-6 flex items-center justify-between">
            <div>
                <p class="text-sm uppercase tracking-wide text-medico-600 font-bold">Médico</p>
                <h1 class="text-3xl font-bold text-slate-800" th:text="${medico != null ? medico.name : 'Nome do médico'}">Nome do médico</h1>
            </div>
            <a th:href="@{/medico}" class="rounded-full bg-medico-500 px-4 py-2 text-sm font-semibold text-white hover:bg-medico-600">← Voltar</a>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full border-separate border-spacing-y-2 text-left text-sm">
                <thead>
                    <tr class="bg-slate-100 text-slate-700">
                        <th class="px-4 py-3 rounded-l-lg">Atleta</th>
                        <th class="px-4 py-3 rounded-r-lg">Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="nome : ${lisNome}" class="bg-slate-50">
                        <td class="px-4 py-3 rounded-l-lg font-medium text-slate-700" th:text="${nome}">Nome atleta</td>
                        <td class="px-4 py-3 rounded-r-lg text-medico-600 font-semibold">Vinculado</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    </main>
    </div>
</body>
</html>
