<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Treinamentos & Saúde - Exercícios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" th:href="@{/icon/iconFun.png}">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        medOrange: {
                            50: '#fffbeb', 100: '#fef3c7', 500: '#f59e0b', 
                            600: '#d97706', 700: '#b45309', 800: '#92400e',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/treinador-layout.css}">
</head>

<body class="treinador-layout bg-black font-serif">
    
    <aside th:replace="~{fragments/treinadorLayout :: sidebar(active='treinos', treinador=${treinador})}"></aside>

    <div class="treinamento-area">
        <nav class="treinamento-abas" aria-label="Etapas do treinamento">
            <a th:href="@{/treinador/treinos/semanas}"><img class="navegacao-icone" th:src="@{/img/calen.svg}" alt="" aria-hidden="true"><span>Semana</span></a>
            <a th:href="@{/treinador/treinos}"><img class="navegacao-icone" th:src="@{/img/treinadorAzul.svg}" alt="" aria-hidden="true"><span>Treino</span></a>
            <a th:href="@{/treinador/treinos/exercicios}" class="selecionado" aria-current="page"><img class="navegacao-icone" th:src="@{/img/atleta.svg}" alt="" aria-hidden="true"><span>Exercício</span></a>
        </nav>
        <main class="flex-1 max-w-4xl w-full mx-auto p-6 space-y-6">
            <!-- Conteúdo da Página -->
            <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-4">
                <div class="pb-3 border-b border-slate-100 flex items-center justify-between">
                    <div>
                        <h3 class="font-bold text-slate-900 text-base">3. Adicionar Exercícios</h3>
                        <p class="text-xs text-slate-500">Selecione a semana e o treinamento para adicionar um exercício.</p>
                    </div>
                    <span class="px-3 py-1 bg-medOrange-50 text-medOrange-700 text-xs font-bold rounded-full">Passo 3</span>
                </div>

                <p th:if="${sucesso}" th:text="${sucesso}" role="status" class="rounded-xl bg-green-50 p-3 text-green-800"></p>
                <p th:if="${erroSelecao}" th:text="${erroSelecao}" role="alert" class="text-red-700"></p>
                <p th:if="${#lists.isEmpty(semanas)}" class="text-sm text-slate-600">Comece <a th:href="@{/treinador/treinos/semanas}" class="underline">criando uma semana</a> para um atleta.</p>
                <form th:action="@{/treinador/treinos/exercicios}" method="get" class="space-y-3">
                    <label for="semanaId" class="block text-xs font-bold uppercase text-slate-500">1. Selecionar semana</label>
                    <select id="semanaId" name="semanaId" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm">
                        <option value="">Selecione uma semana</option>
                        <option th:each="s : ${semanas}" th:value="${s.id}" th:selected="${s.id == exercicioForm.semanaId}" th:text="|${s.nome} — ${s.atleta_fk.name}|"></option>
                    </select>
                    <button type="submit" th:disabled="${#lists.isEmpty(semanas)}" class="rounded-xl border border-medOrange-600 px-4 py-2 text-sm text-medOrange-700 disabled:opacity-50">Selecionar semana</button>
                </form>
                <p th:if="${exercicioForm.semanaId != null and #lists.isEmpty(treinamentos)}" class="text-sm text-slate-600">Nenhum treinamento disponível nesta semana. <a th:href="@{/treinador/treinos}" class="underline">Cadastre um treinamento</a> antes de adicionar exercícios.</p>
                <form id="exercicio-form" th:action="@{/treinador/treinos/exercicios}" th:object="${exercicioForm}" method="post" class="space-y-4">
                    <input type="hidden" name="semanaId" th:value="*{semanaId}">
                    <ul th:if="${#fields.hasAnyErrors()}" role="alert" class="text-sm text-red-700">
                        <li th:each="erro : ${#fields.allErrors()}" th:text="${erro}"></li>
                    </ul>
                    <fieldset id="exercicio-campos" th:disabled="${#lists.isEmpty(treinamentos)}" class="space-y-4 disabled:opacity-50">
                    <div>
                        <label for="treinamentoId" class="block text-xs font-bold uppercase text-slate-500 mb-1">2. Selecionar treinamento da semana</label>
                        <select th:field="*{treinamentoId}" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm">
                            <option value="">Selecione um treinamento</option>
                            <option th:each="t : ${treinamentos}" th:value="${t.id}" th:text="|${t.dia_fk.nome.rotulo} — ${t.nome} (${t.horarioInicio})|"></option>
                        </select>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="nome" class="block text-xs font-bold uppercase text-slate-500 mb-1">Nome do Exercício</label>
                            <input type="text" th:field="*{nome}" maxlength="255" required placeholder="Ex: Corrida 5km" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-medOrange-500 outline-none">
                        </div>
                        <div>
                            <label for="descricao" class="block text-xs font-bold uppercase text-slate-500 mb-1">Descrição</label>
                            <input type="text" th:field="*{descricao}" maxlength="255" placeholder="Ritmo constante" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-medOrange-500 outline-none">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="duracao" class="block text-xs font-bold uppercase text-slate-500 mb-1">Duração (minutos)</label>
                            <input type="number" th:field="*{duracao}" min="1" step="1" required placeholder="Ex: 30" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-medOrange-500 outline-none">
                        </div>
                      
                    </div>
                    <div class="flex justify-end pt-2">
                        <button type="submit" class="px-5 py-2.5 bg-medOrange-600 hover:bg-medOrange-700 text-white font-semibold rounded-xl text-sm transition shadow-sm flex items-center gap-2">
                            <i class="fa-solid fa-circle-plus"></i> Adicionar Exercício
                        </button>
                    </div>
                    </fieldset>
                </form>
            </div>
        </main>
    </div>

<script>
    // Uma nova semana precisa ser carregada antes de cadastrar o exercício.
    document.getElementById('semanaId').addEventListener('change', function () {
        document.getElementById('exercicio-campos').disabled = true;
        document.getElementById('treinamentoId').value = '';
    });
</script>
</body>
</html>
