<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
    <aside th:fragment="menu(pagina, treinador)" class="flex shrink-0 flex-wrap items-center bg-amber-500 text-neutral-900 sm:sticky sm:top-0 sm:h-screen sm:w-56 sm:flex-col sm:flex-nowrap sm:items-stretch sm:overflow-y-auto">
        <strong class="min-w-0 flex-1 break-words bg-neutral-800 px-4 py-3 text-sm text-white sm:flex-none sm:py-6"
                th:text="${treinador != null ? treinador.name : 'Portal do Treinador'}">Portal do Treinador</strong>

        <nav aria-label="Menu do treinador"
             class="order-1 flex w-full flex-wrap sm:order-none sm:flex-col sm:py-4">
            <a th:href="@{/treinador}"
               class="flex min-h-11 items-center gap-2 px-3 py-2 text-xs font-bold
                      focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-700 hover:bg-amber-600 sm:px-4 sm:py-3 sm:text-sm"
               th:attr="aria-current=${pagina == 'painel' ? 'page' : null}"
               th:classappend="${pagina == 'painel' ? 'bg-amber-600' : null}">
                <img class="h-5 w-5 shrink-0 object-contain" th:src="@{/img/dash.svg}" alt="">Dashboard
            </a>
            <a th:href="@{/treinador/atletas-vinculados}"
               class="flex min-h-11 items-center gap-2 px-3 py-2 text-xs font-bold
                      focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-700 hover:bg-amber-600 sm:px-4 sm:py-3 sm:text-sm"
               th:attr="aria-current=${pagina == 'atletas' ? 'page' : null}"
               th:classappend="${pagina == 'atletas' ? 'bg-amber-600' : null}">
                <img class="h-5 w-5 shrink-0 object-contain" th:src="@{/img/treinadorBranca.svg}" alt="">Atletas vinculados
            </a>
            <a th:href="@{/treinador/perfil}"
               class="flex min-h-11 items-center gap-2 px-3 py-2 text-xs font-bold
                      focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-700 hover:bg-amber-600 sm:px-4 sm:py-3 sm:text-sm"
               th:attr="aria-current=${pagina == 'perfil' ? 'page' : null}"
               th:classappend="${pagina == 'perfil' ? 'bg-amber-600' : null}">
                <img class="h-5 w-5 shrink-0 object-contain" th:src="@{/img/user.svg}" alt="">Perfil
            </a>
            <a th:href="@{/treinador/treinos/semanas}"
               class="flex min-h-11 items-center gap-2 px-3 py-2 text-xs font-bold
                      focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-700 hover:bg-amber-600 sm:px-4 sm:py-3 sm:text-sm"
               th:attr="aria-current=${pagina == 'treinos' ? 'page' : null}"
               th:classappend="${pagina == 'treinos' ? 'bg-amber-600' : null}">
                <img class="h-5 w-5 shrink-0 object-contain" th:src="@{/img/calen.svg}" alt="">Treinos
            </a>
        </nav>

        <form th:action="@{/logout}" method="post" class="bg-red-600 text-white sm:mt-auto">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="min-h-11 w-full px-4 py-2 text-left text-sm font-bold hover:bg-red-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-white">Sair</button>
        </form>
    </aside>
</body>
</html>
