<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Treinador</title>
        <link rel="icon" th:href="@{/img/iconFun.png}">
        <script th:src="@{/js/vendor/tailwindcss-3.4.17.js}"></script>
        <script th:src="@{/js/tailwind-theme.js}"></script>
    <script defer th:src="@{/js/treinador-dashboard.js}"></script>
</head>
<body class="min-h-screen bg-[#f9f8f6] font-sans text-slate-700">
    <div class="min-h-screen flex flex-col sm:flex-row">

        <div th:replace="~{treinadorPages/navegacao :: menu('painel', ${treinador})}"></div>

        <main class="min-w-0 flex-1">
            <div class="px-5 py-6 sm:px-8 lg:px-10">
            <div class="mx-auto max-w-6xl">

                <h1 class="font-display text-2xl font-bold text-treinador-700 sm:text-3xl">Painel do Treinador</h1>

                <div class="mt-6 gap-5 flex flex-col sm:flex-row sm:flex-wrap sm:[&>*]:w-[calc(50.000000%_-_0.625000rem)] [&>*]:min-w-0">
                    <div class="rounded-xl border border-slate-100 bg-white p-5 shadow-sm">
                        <p class="text-sm text-slate-500">Atletas Vinculados</p>
                        <p class="mt-2 text-3xl font-bold text-treinador-700" th:text="${vinculados_count}"></p>
                    </div>
                    <div class="rounded-xl border border-slate-100 bg-white p-5 shadow-sm">
                        <p class="text-sm text-slate-500">Atletas Novos</p>
                        <p class="mt-2 text-3xl font-bold text-treinador-700" th:text="${atleta_sem_Vinculacao}"></p>
                    </div>
                </div>

                <div class="mt-8 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5 text-treinador-600"><path stroke-linecap="round" stroke-linejoin="round" d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path stroke-linecap="round" stroke-linejoin="round" d="M19 8v6M22 11h-6"/></svg>
                    <h2 class="font-display text-xl font-bold text-treinador-700 sm:text-2xl">Adicionar Novos Atletas</h2>
                </div>

                <div class="mt-4">
                    <label class="block" for="search">
                        <span class="sr-only">Buscar por nome ou CPF...</span>
                        <input type="search" id="search" placeholder="Buscar por nome ou CPF..."
                               class="w-full rounded-lg border border-slate-200 bg-white px-4 py-3 outline-none focus:border-treinador-500">
                    </label>
                </div>

                <div id="lista-atletas" class="scroll-mt-5 mt-4 overflow-hidden rounded-xl border border-slate-100 shadow-sm" th:if="${not #lists.isEmpty(listaAtletas)}">
                    <div class="overflow-x-auto">
                        <table class="w-full min-w-[760px] text-left text-sm">
                            <thead class="bg-treinador-50 text-treinador-700">
                                    <tr><th th:each="coluna : ${ {'ID','Nomes','CPF','Sexo','E-mail','Localização','Ação'} }" th:text="${coluna}" class="px-4 py-3 font-bold"></th></tr>
                                </thead>
                            <tbody id="tbody" class="divide-y divide-slate-100 bg-white">
                                <tr class="athlete-row hover:bg-treinador-50/40"
                                    th:each="atleta : ${listaAtletas}"
                                    th:data-name="${atleta.per_nome}"
                                    th:data-cpf="${atleta.cpf}">
                                    <td class="px-4 py-3 font-bold text-slate-700" th:text="${atleta.id}">71</td>
                                    <td class="px-4 py-3 font-semibold text-slate-800" th:text="${atleta.per_nome}">Atleta 0</td>
                                    <td class="px-4 py-3 text-slate-600" th:text="${atleta.cpf}">99988777666666</td>
                                    <td class="px-4 py-3 text-slate-600" th:text="${atleta.sexo}">M</td>
                                    <td class="px-4 py-3 text-slate-600" th:text="${atleta.email}">atleta0@exemplo.com</td>
                                    <td class="px-4 py-3 text-slate-600" th:text="${atleta.cidade}">Recife - PE</td>
                                    <td class="px-4 py-3 text-right">
                                        <form th:action="@{/treinador/{tId}/vincular-atleta/{aId}(tId=${treinador.id}, aId=${atleta.id})}" method="POST">
                                            <button type="submit" class="rounded-lg px-4 py-2 font-bold text-white bg-treinador-600 hover:bg-treinador-700">Vincular</button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(listaAtletas)}" class="mt-4">
                    <div class="rounded-xl border border-slate-100 bg-white p-8 text-center">
                        <h2 class="font-bold text-treinador-700">Nenhum atleta novo por aqui</h2>
                        <p class="mt-2 text-sm text-slate-500">Assim que um novo atleta se cadastrar no sistema, ele aparecerá aqui para vínculo.</p>
                    </div>
                </div>
                <p id="empty" class="hidden mt-3 text-center text-sm text-slate-400">Nenhum atleta encontrado para essa busca.</p>

            </div>
            </div>
        </main>
    </div>

</body>
</html>
