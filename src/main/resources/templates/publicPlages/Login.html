<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessar Portal | Sistema Médico Desportivo</title>
    <th:block th:replace="~{fragments/layout :: head-resources}"></th:block>
</head>
<body class="min-h-screen bg-[#f7f9f8] font-sans text-slate-700">

    <header th:replace="~{fragments/layout :: brand-header(titulo='Acessar Portal', tone='brand')}"></header>

    <main class="flex min-h-[calc(100vh-64px)] items-center justify-center px-5 py-10 sm:px-8">
        <div class="w-full max-w-sm rounded-2xl border border-slate-100 bg-white p-8 shadow-sm">
            <div class="mb-6 text-center">
                <span class="mx-auto flex h-11 w-11 items-center justify-center rounded-xl bg-brand-600 text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12Zm0 2.2c-3.3 0-9.8 1.6-9.8 4.9v2.7h19.6v-2.7c0-3.3-6.5-4.9-9.8-4.9Z"/></svg>
                </span>
                <h1 class="mt-3 font-display text-xl font-bold text-slate-800">Bem-vindo de volta</h1>
                <p class="mt-1 text-sm text-slate-400">Entre com seu CPF e senha para continuar</p>
            </div>

            <div th:if="${param.error}" class="mb-4 rounded-lg bg-rose-50 px-3 py-2 text-center text-sm font-medium text-rose-600">
                CPF ou senha incorretos.
            </div>

            <form th:action="@{/login}" method="post" class="space-y-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div>
                    <label for="cpf" class="mb-1 block text-xs font-bold uppercase tracking-wide text-slate-500">CPF</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required
                           class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-100">
                </div>

                <div>
                    <label for="password" class="mb-1 block text-xs font-bold uppercase tracking-wide text-slate-500">Palavra-chave</label>
                    <input type="password" id="password" name="password" placeholder="••••••" required
                           class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-100">
                </div>

                <button type="submit"
                        class="w-full rounded-full bg-brand-600 py-2.5 text-sm font-bold uppercase tracking-wide text-white transition hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-300">
                    Entrar
                </button>

                <p class="text-center text-sm">
                    <a href="#" class="font-medium text-slate-500 hover:text-brand-600">Esqueceu sua senha?</a>
                </p>
            </form>
        </div>
    </main>

</body>
</html>
