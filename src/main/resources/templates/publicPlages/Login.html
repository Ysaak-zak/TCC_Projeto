<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Portal Olímpico</title>
    <link rel="icon" th:href="@{/img/iconFun.png}">
    <script th:src="@{/js/vendor/tailwindcss-3.4.17.js}"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-100 p-4 sm:p-8">
    <main class="flex w-full max-w-lg overflow-hidden rounded-3xl bg-white shadow-xl md:min-h-[36rem] md:max-w-5xl">
        <section aria-labelledby="login-title" class="flex w-full flex-col justify-center p-6 sm:p-12 md:w-1/2 lg:p-16">
            <a th:href="@{/home}" class="self-start text-xs font-bold uppercase tracking-widest text-sky-800 hover:underline">
                Portal Olímpico
            </a>
            <h1 id="login-title" class="mt-3 text-3xl font-bold tracking-tight text-slate-800 lg:text-4xl">
                Acesse sua conta
            </h1>
            <p class="mt-3 text-slate-600">Entre para continuar acompanhando sua equipe.</p>
            <div class="mb-7 mt-5 h-1 w-14 rounded-full bg-teal-500" aria-hidden="true"></div>

            <p th:if="${param.error}" role="alert" class="mb-4 rounded-lg bg-red-50 p-3 text-sm text-red-800">
                CPF ou senha incorretos.
            </p>

            <form th:action="@{/login}" method="post" class="flex flex-col gap-5">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div>
                    <label for="cpf" class="mb-2 block text-sm font-semibold text-slate-800">CPF</label>
                    <input id="cpf" name="cpf" type="text" inputmode="numeric" autocomplete="username"
                           placeholder="000.000.000-00" required
                           class="w-full rounded-lg border border-slate-300 bg-slate-50 px-4 py-3 focus:border-sky-700 focus:outline-sky-700">
                </div>

                <div>
                    <label for="password" class="mb-2 block text-sm font-semibold text-slate-800">Senha</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required
                           class="w-full rounded-lg border border-slate-300 bg-slate-50 px-4 py-3 focus:border-sky-700 focus:outline-sky-700">
                </div>

                <button type="submit" class="rounded-lg bg-slate-800 px-4 py-3 font-bold text-white hover:bg-sky-800 focus-visible:outline-sky-700">
                    Entrar
                </button>
            </form>
        </section>

        <div class="relative hidden w-1/2 items-end bg-slate-800 md:flex" aria-hidden="true">
            <img src="https://images.unsplash.com/photo-1540497077202-7c8a3999166f?q=80&amp;w=1000&amp;auto=format&amp;fit=crop"
                 alt="" class="absolute inset-0 h-full w-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-slate-950/40 to-transparent"></div>
           
        </div>
    </main>
</body>
</html>
