
name: Deploy TCC

on:
  push:
    branches: [producao]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar SSH
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST_KEYS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_KEY" || { echo "VPS_SSH_KEY ausente"; exit 1; }
          test -n "$HOST_KEYS" || { echo "VPS_KNOWN_HOSTS ausente"; exit 1; }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEYS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

          ssh-keygen -y -P "" -f ~/.ssh/id_ed25519 > /dev/null

      - name: Enviar projeto
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          test -n "$VPS_HOST" || { echo "VPS_HOST ausente"; exit 1; }
          test -n "$VPS_USER" || { echo "VPS_USER ausente"; exit 1; }

          rsync -az \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='target/' \
            --exclude='uploads/' \
            -e "ssh -o StrictHostKeyChecking=yes" \
            ./ "$VPS_USER@$VPS_HOST:/opt/projeto-tcc/"

      - name: Iniciar Docker
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'cd /opt/projeto-tcc &&
             docker compose -f docker-compose.yml config --quiet &&
             docker compose -f docker-compose.yml up -d --build &&
             docker compose -f docker-compose.yml ps'


             