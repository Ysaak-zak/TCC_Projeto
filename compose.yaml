
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: PROJETO_TCC
      POSTGRES_USER: projeto
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projeto -d PROJETO_TCC"]
      interval: 10s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "0"
    mem_limit: 3g

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/PROJETO_TCC
      SPRING_DATASOURCE_USERNAME: projeto
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_OLLAMA_BASE_URL: http://ollama:11434
      APP_OLLAMA_MODEL_NAME: llama3.2:1b
      APP_OLLAMA_AUTO_START: "false"
      JAVA_TOOL_OPTIONS: -Xmx1024m
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  postgres_data:
  ollama_data:
